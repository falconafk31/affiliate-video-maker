version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: affiliate_backend
    restart: unless-stopped
    ports:
      - "9000:9000"
    env_file:
      - ./backend/.env
    environment:
      # These can still be overridden if needed
      - POLLINATIONS_API_URL=${POLLINATIONS_API_URL:-https://gen.pollinations.ai}
    volumes:
      # Persist the logs and static library
      - ./backend/logs:/app/logs
      - ./backend/static:/app/static

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Pass the API URL to be baked into Nuxt/Vue during build
        VITE_API_BASE_URL: ""
    container_name: affiliate_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
